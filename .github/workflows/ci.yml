name: LinguaFlow CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linguaflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Validate
        run: pnpm exec prisma validate

      - name: Push Database Schema
        run: pnpm exec prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/linguaflow_db?schema=public

      - name: Run Domain Unit Tests
        run: pnpm --filter "@linguaflow/domain" test

      - name: Run API Tests
        run: pnpm --filter "@linguaflow/api" test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/linguaflow_db?schema=public
          JWT_SECRET: 'linguaflow_test_super_secret_jwt_key_2026'

      - name: Typecheck API
        run: pnpm --filter "@linguaflow/api" exec tsc --noEmit

      - name: Lint Web Application
        run: pnpm --filter "web" lint

      - name: Build Web Application
        run: pnpm --filter "web" build
