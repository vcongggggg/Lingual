name: LinguaFlow CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Validate
        run: pnpm exec prisma validate

      - name: Run Domain Unit Tests
        run: pnpm --filter "@linguaflow/domain" test

      - name: Run API Tests
        run: pnpm --filter "@linguaflow/api" test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/linguaflow_db?schema=public' }}
          JWT_SECRET: 'linguaflow_test_super_secret_jwt_key_2026'

      - name: Typecheck API
        run: pnpm --filter "@linguaflow/api" exec tsc --noEmit

      - name: Lint Web Application
        run: pnpm --filter "web" lint

      - name: Build Web Application
        run: pnpm --filter "web" build
